services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aec-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AeC@Dev123"
    ports:
      - "1433:1433"
    volumes:
      - aec-sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "AeC@Dev123" -No -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  aec-sqldata:
